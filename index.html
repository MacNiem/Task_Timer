<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Timer</title>
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161C24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Task Timer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the chosen theme before the first paint, so the screen doesn't flash light.
  try {
    var t = localStorage.getItem('taskTimer.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="warn" class="warn" role="status" hidden>Your data is not being saved in this browser. Export a backup.</div>
<div id="app"></div>
<div id="update" class="update" role="status" hidden>
  <span>New version available</span>
  <button class="btn btn-main" type="button" id="updateReload">Reload</button>
</div>
<div id="dock" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="sheet-root"></div>
<div id="printReport"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/version.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
