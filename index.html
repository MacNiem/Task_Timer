<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Timer</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e2e5ea;
    --accent: #2f6fed;
    --accent-soft: #e8f0fe;
    --ok: #1f9d55;
    --ok-soft: #e6f6ec;
    --warn: #c47f00;
    --danger: #d64545;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  .app {
    display: grid;
    grid-template-columns: 290px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  aside h1 { font-size: 20px; margin: 0; }
  aside h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 6px;
  }
  main { padding: 28px 32px; max-width: 900px; width: 100%; }

  form.inline { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  button {
    font: inherit;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #f0f2f5; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #2259c9; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.ok:hover:not(:disabled) { background: #187d44; }
  button.danger { color: var(--danger); }
  button.small { padding: 5px 9px; font-size: 13px; }

  .list-nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .list-nav li button {
    width: 100%;
    text-align: left;
    border: none;
    padding: 9px 10px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .list-nav li button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .list-nav .meta { color: var(--muted); font-size: 12px; font-weight: 400; }
  .list-nav .name { overflow: hidden; text-overflow: ellipsis; }
  .empty-nav { color: var(--muted); font-size: 13px; margin: 0; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header h2 { margin: 0; font-size: 26px; word-break: break-word; }
  .header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .header .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .total {
    margin: 20px 0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    min-width: 140px;
  }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .tasks { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .task {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 14px;
  }
  .task.running { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .task.done { background: var(--ok-soft); border-color: #bfe5cd; }
  .task .tname { font-weight: 500; word-break: break-word; }
  .task .tstate { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task.running .tstate { color: var(--accent); }
  .task.done .tstate { color: var(--ok); }
  .task .time { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; min-width: 90px; text-align: right; }
  .task .btns { display: flex; gap: 6px; }

  .notice {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 8px;
    background: #fff7e6;
    color: #7a5200;
    border: 1px solid #f3dca6;
    font-size: 14px;
  }
  .closed-badge {
    display: inline-block;
    background: var(--ok-soft);
    color: var(--ok);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .placeholder {
    margin-top: 80px;
    text-align: center;
    color: var(--muted);
  }
  .placeholder h2 { color: var(--text); }

  .modal[hidden] { display: none; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 33, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .modal-box {
    background: var(--panel);
    border-radius: var(--radius);
    width: min(900px, 100%);
    height: min(92vh, 1100px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head .actions { display: flex; gap: 8px; }
  .modal iframe { flex: 1; border: 0; width: 100%; background: #525659; }
  a.btn {
    display: inline-block;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--accent);
  }
  a.btn.primary { background: var(--accent); color: #fff; }
  a.btn.primary:hover { background: #2259c9; }

  @media (max-width: 760px) {
    .modal { padding: 8px; }
    .app { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 20px 16px; }
    .task { grid-template-columns: 1fr auto; }
    .task .btns { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>⏱ Task Timer</h1>

    <div>
      <h2>Nowa lista</h2>
      <form class="inline" id="newListForm">
        <input type="text" id="newListName" placeholder="Nazwa listy zadań" maxlength="100" required>
        <button class="primary" type="submit">Utwórz</button>
      </form>
    </div>

    <div>
      <h2>Aktywne listy</h2>
      <ul class="list-nav" id="activeLists"></ul>
    </div>

    <div>
      <h2>Zamknięte listy</h2>
      <ul class="list-nav" id="closedLists"></ul>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="modal" id="pdfModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <strong>Podgląd PDF</strong>
      <div class="actions">
        <a class="btn primary" id="pdfDownload" href="#">Pobierz PDF</a>
        <button id="pdfClose">Zamknij</button>
      </div>
    </div>
    <iframe id="pdfFrame" title="Podgląd PDF"></iframe>
  </div>
</div>

<script src="lib/pdfmake.min.js"></script>
<script src="lib/vfs_fonts.js"></script>
<script>
(() => {
  const STORAGE_KEY = 'taskTimer.v1';

  // ---------- Stan ----------
  let state = load();
  let selectedId = state.selectedId || null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* brak dostępu do storage */ }
    return { lists: [] };
  }
  function save() {
    state.selectedId = selectedId;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const getList = id => state.lists.find(l => l.id === id);

  function elapsed(task) {
    return task.elapsedMs + (task.runningSince ? Date.now() - task.runningSince : 0);
  }
  function listTotal(list) {
    return list.tasks.reduce((s, t) => s + elapsed(t), 0);
  }
  function fmt(ms) {
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  function fmtDate(ts) {
    return new Date(ts).toLocaleString('pl-PL', { dateStyle: 'medium', timeStyle: 'short' });
  }
  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- Akcje ----------
  function createList(name) {
    const list = { id: uid(), name, createdAt: Date.now(), closedAt: null, tasks: [] };
    state.lists.push(list);
    selectedId = list.id;
    save(); render();
  }

  function renameList(list) {
    const name = prompt('Nowa nazwa listy:', list.name);
    if (name && name.trim()) {
      list.name = name.trim();
      save(); render();
    }
  }

  function deleteList(list) {
    if (!confirm(`Usunąć listę „${list.name}”? Tej operacji nie można cofnąć.`)) return;
    state.lists = state.lists.filter(l => l.id !== list.id);
    if (selectedId === list.id) selectedId = null;
    save(); render();
  }

  function addTask(list, name) {
    list.tasks.push({ id: uid(), name, elapsedMs: 0, runningSince: null, done: false });
    save(); render();
  }

  function pauseTask(task) {
    if (task.runningSince) {
      task.elapsedMs += Date.now() - task.runningSince;
      task.runningSince = null;
    }
  }

  function startTask(list, task) {
    // W danej liście odliczanie trwa tylko dla jednego zadania naraz.
    list.tasks.forEach(t => { if (t !== task) pauseTask(t); });
    if (!task.runningSince) task.runningSince = Date.now();
    save(); render();
  }

  function finishTask(task) {
    pauseTask(task);
    task.done = true;
    save(); render();
  }

  function reopenTask(task) {
    task.done = false;
    save(); render();
  }

  function deleteTask(list, task) {
    if (!confirm(`Usunąć zadanie „${task.name}”?`)) return;
    list.tasks = list.tasks.filter(t => t !== task);
    save(); render();
  }

  function canClose(list) {
    return list.tasks.length > 0 && list.tasks.every(t => t.done);
  }

  function closeList(list) {
    if (!canClose(list)) return;
    if (!confirm(`Zamknąć listę „${list.name}”? Po zamknięciu nie będzie można jej edytować.`)) return;
    list.tasks.forEach(pauseTask);
    list.closedAt = Date.now();
    save(); render();
  }

  // ---------- Eksport do PDF ----------
  function pdfDefinition(list) {
    const head = ['#', 'Zadanie', 'Czas'].map((text, i) => ({
      text, style: 'th', alignment: i === 2 ? 'right' : 'left'
    }));
    const body = list.tasks.map((t, i) => [
      { text: String(i + 1), color: '#666666' },
      t.name,
      { text: fmt(elapsed(t)), alignment: 'right' }
    ]);
    const foot = [
      '',
      { text: 'Łącznie', bold: true },
      { text: fmt(listTotal(list)), bold: true, alignment: 'right' }
    ];

    return {
      pageSize: 'A4',
      pageMargins: [50, 50, 50, 60],
      info: { title: `${list.name} - raport czasu` },
      content: [
        { text: list.name, style: 'h1' },
        {
          style: 'meta',
          text: [
            `Utworzono: ${fmtDate(list.createdAt)}\n`,
            `Zamknięto: ${fmtDate(list.closedAt)}\n`,
            `Liczba zadań: ${list.tasks.length}`
          ]
        },
        {
          table: { headerRows: 1, widths: [24, '*', 80], body: [head, ...body, foot] },
          layout: {
            fillColor: row => row === 0 ? '#f0f2f5' : null,
            hLineWidth: (i, node) => i === node.table.body.length - 1 ? 1.5 : (i === 0 ? 0 : 0.5),
            hLineColor: (i, node) => i === node.table.body.length - 1 ? '#333333' : '#cccccc',
            vLineWidth: () => 0,
            paddingTop: () => 6,
            paddingBottom: () => 6
          }
        }
      ],
      footer: (page, pages) => ({
        columns: [
          { text: `Wygenerowano: ${fmtDate(Date.now())} · Task Timer`, alignment: 'left' },
          { text: `Strona ${page} / ${pages}`, alignment: 'right' }
        ],
        margin: [50, 20, 50, 0],
        fontSize: 8,
        color: '#888888'
      }),
      styles: {
        h1: { fontSize: 20, bold: true, margin: [0, 0, 0, 6] },
        meta: { fontSize: 10, color: '#555555', lineHeight: 1.3, margin: [0, 0, 0, 16] },
        th: { fontSize: 9, bold: true, color: '#333333' }
      },
      defaultStyle: { font: 'Roboto', fontSize: 11 }
    };
  }

  const $pdfModal = document.getElementById('pdfModal');
  const $pdfFrame = document.getElementById('pdfFrame');
  const $pdfDownload = document.getElementById('pdfDownload');
  let pdfUrl = null;

  function exportPdf(list) {
    if (!window.pdfMake) {
      alert('Nie udało się załadować biblioteki PDF (folder lib/).');
      return;
    }
    pdfMake.createPdf(pdfDefinition(list)).getBlob(blob => {
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = URL.createObjectURL(blob);
      $pdfFrame.src = pdfUrl;
      $pdfDownload.href = pdfUrl;
      $pdfDownload.download = `${list.name.replace(/[\\/:*?"<>|]+/g, '_')} - raport czasu.pdf`;
      $pdfModal.hidden = false;
    });
  }

  function closePdf() {
    $pdfModal.hidden = true;
    $pdfFrame.src = 'about:blank';
  }
  document.getElementById('pdfClose').addEventListener('click', closePdf);
  $pdfModal.addEventListener('click', e => { if (e.target === $pdfModal) closePdf(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$pdfModal.hidden) closePdf(); });

  // ---------- Widok ----------
  const $main = document.getElementById('main');

  function renderNav() {
    const active = state.lists.filter(l => !l.closedAt);
    const closed = state.lists.filter(l => l.closedAt);
    const item = l => {
      const done = l.tasks.filter(t => t.done).length;
      const meta = l.closedAt ? fmt(listTotal(l)) : `${done}/${l.tasks.length}`;
      return `<li><button data-select="${l.id}" class="${l.id === selectedId ? 'active' : ''}">
        <span class="name">${esc(l.name)}</span><span class="meta" ${l.closedAt ? '' : `data-nav-time="${l.id}"`}>${meta}</span>
      </button></li>`;
    };
    document.getElementById('activeLists').innerHTML =
      active.length ? active.map(item).join('') : '<p class="empty-nav">Brak aktywnych list</p>';
    document.getElementById('closedLists').innerHTML =
      closed.length ? closed.map(item).join('') : '<p class="empty-nav">Brak zamkniętych list</p>';
  }

  function renderMain() {
    const list = getList(selectedId);
    if (!list) {
      $main.innerHTML = `<div class="placeholder">
        <h2>Wybierz lub utwórz listę zadań</h2>
        <p>Wpisz nazwę nowej listy w panelu po lewej stronie.</p>
      </div>`;
      return;
    }

    const closed = !!list.closedAt;
    const doneCount = list.tasks.filter(t => t.done).length;
    const closable = canClose(list);

    let notice = '';
    if (!closed) {
      if (list.tasks.length === 0) notice = 'Dodaj co najmniej jedno zadanie. Listę można zamknąć dopiero po zakończeniu wszystkich zadań.';
      else if (!closable) notice = `Aby zamknąć listę, zakończ wszystkie zadania (pozostało: ${list.tasks.length - doneCount}).`;
    }

    $main.innerHTML = `
      <div class="header">
        <div>
          <h2>${esc(list.name)}${closed ? '<span class="closed-badge">Zamknięta</span>' : ''}</h2>
          <div class="sub">Utworzono: ${fmtDate(list.createdAt)}${closed ? ` · Zamknięto: ${fmtDate(list.closedAt)}` : ''}</div>
        </div>
        <div class="actions">
          ${closed
            ? `<button class="primary" data-act="pdf">Podgląd / zapis PDF</button>
               <button class="danger" data-act="delete-list">Usuń listę</button>`
            : `<button data-act="rename">Zmień nazwę</button>
               <button class="danger" data-act="delete-list">Usuń</button>
               <button class="ok" data-act="close" ${closable ? '' : 'disabled'}
                 title="${closable ? 'Zamknij listę' : 'Najpierw zakończ wszystkie zadania'}">Zamknij listę</button>`}
        </div>
      </div>

      <div class="total">
        <div class="stat"><div class="label">Łączny czas</div><div class="value" id="totalTime">${fmt(listTotal(list))}</div></div>
        <div class="stat"><div class="label">Zakończone zadania</div><div class="value">${doneCount} / ${list.tasks.length}</div></div>
      </div>

      ${closed ? '' : `
      <form class="inline" id="newTaskForm">
        <input type="text" id="newTaskName" placeholder="Nazwa nowego zadania" maxlength="200" required>
        <button class="primary" type="submit">Dodaj zadanie</button>
      </form>`}

      ${notice ? `<div class="notice">${notice}</div>` : ''}

      <div class="tasks">
        ${list.tasks.map(t => taskHtml(t, closed)).join('')}
      </div>`;

    const form = document.getElementById('newTaskForm');
    if (form) {
      form.addEventListener('submit', e => {
        e.preventDefault();
        const input = document.getElementById('newTaskName');
        const name = input.value.trim();
        if (!name) return;
        addTask(list, name);
        document.getElementById('newTaskName').focus();
      });
    }
  }

  function taskHtml(t, closed) {
    const running = !!t.runningSince;
    const cls = t.done ? 'done' : running ? 'running' : '';
    const stateLabel = t.done ? 'Zakończone' : running ? 'W trakcie…' : (t.elapsedMs > 0 ? 'Wstrzymane' : 'Nierozpoczęte');
    let btns = '';
    if (!closed) {
      if (t.done) {
        btns = `<button class="small" data-task="${t.id}" data-tact="reopen">Wznów</button>`;
      } else {
        btns = running
          ? `<button class="small" data-task="${t.id}" data-tact="pause">⏸ Pauza</button>`
          : `<button class="small primary" data-task="${t.id}" data-tact="start">▶ Start</button>`;
        btns += `<button class="small ok" data-task="${t.id}" data-tact="finish">✔ Zakończ</button>`;
      }
      btns += `<button class="small danger" data-task="${t.id}" data-tact="delete" title="Usuń zadanie">✕</button>`;
    }
    return `<div class="task ${cls}">
      <div><div class="tname">${esc(t.name)}</div><div class="tstate">${stateLabel}</div></div>
      <div class="time" data-time="${t.id}">${fmt(elapsed(t))}</div>
      <div class="btns">${btns}</div>
    </div>`;
  }

  function render() { renderNav(); renderMain(); }

  // Odświeżanie liczników bez przebudowy całego widoku
  function tick() {
    const list = getList(selectedId);
    if (list && !list.closedAt) {
      list.tasks.forEach(t => {
        const el = document.querySelector(`[data-time="${t.id}"]`);
        if (el) el.textContent = fmt(elapsed(t));
      });
      const total = document.getElementById('totalTime');
      if (total) total.textContent = fmt(listTotal(list));
    }
  }
  setInterval(tick, 500);

  // ---------- Zdarzenia ----------
  document.getElementById('newListForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('newListName');
    const name = input.value.trim();
    if (!name) return;
    createList(name);
    input.value = '';
    const taskInput = document.getElementById('newTaskName');
    if (taskInput) taskInput.focus();
  });

  document.querySelector('aside').addEventListener('click', e => {
    const btn = e.target.closest('[data-select]');
    if (!btn) return;
    selectedId = btn.dataset.select;
    save(); render();
  });

  $main.addEventListener('click', e => {
    const list = getList(selectedId);
    if (!list) return;

    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      const act = actBtn.dataset.act;
      if (act === 'rename') renameList(list);
      else if (act === 'delete-list') deleteList(list);
      else if (act === 'close') closeList(list);
      else if (act === 'pdf') exportPdf(list);
      return;
    }

    const taskBtn = e.target.closest('[data-tact]');
    if (taskBtn && !list.closedAt) {
      const task = list.tasks.find(t => t.id === taskBtn.dataset.task);
      if (!task) return;
      const act = taskBtn.dataset.tact;
      if (act === 'start') startTask(list, task);
      else if (act === 'pause') { pauseTask(task); save(); render(); }
      else if (act === 'finish') finishTask(task);
      else if (act === 'reopen') reopenTask(task);
      else if (act === 'delete') deleteTask(list, task);
    }
  });

  // Zapis stanu przy zamykaniu karty (czas biegnącego zadania liczony jest od znacznika startu)
  window.addEventListener('beforeunload', save);

  render();
})();
</script>
</body>
</html>
